# Redis-specific alerts
# Only apply when DATASTORE=redis
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ld-relay-redis-alerts
  namespace: default
  labels:
    app: ld-relay
    prometheus: kube-prometheus-stack
spec:
  groups:
    - name: ld-relay-redis
      interval: 30s
      rules:
        # Alert when Redis is down
        - alert: RedisDown
          expr: redis_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis is down"
            description: "Redis instance {{ $labels.instance }} has been down for more than 2 minutes."
        
        # Alert on high Redis memory usage
        - alert: RedisHighMemoryUsage
          expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis memory usage is high"
            description: "Redis instance {{ $labels.instance }} is using more than 80% of available memory."

