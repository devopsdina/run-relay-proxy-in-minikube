apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  labels:
    app: redisinsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
    spec:
      containers:
        - name: redisinsight
          image: redis/redisinsight:2.54.0
          ports:
            - containerPort: 5540
              name: http
          env:
            - name: RIPORT
              value: "5540"
            - name: RITRUSTEDORIGINS
              value: "http://localhost:8001"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: redisinsight-data
              mountPath: /data
      volumes:
        - name: redisinsight-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  labels:
    app: redisinsight
spec:
  selector:
    app: redisinsight
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 5540
      name: http
  type: ClusterIP

