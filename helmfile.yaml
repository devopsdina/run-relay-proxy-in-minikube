# Helmfile for deploying LaunchDarkly Relay Proxy with Redis
#
# This file coordinates the deployment of both Redis and the Relay Proxy,
# ensuring Redis is ready before the Relay Proxy starts.
#
# Usage:
# 1. Deploy: helmfile sync
# 2. Update: helmfile apply
# 3. Remove: helmfile destroy
#
# For more info: https://github.com/helmfile/helmfile

repositories:
  - name: launchdarkly-ld-relay
    url: https://launchdarkly.github.io/ld-relay-helm
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: redis
    namespace: default
    chart: bitnami/redis
    version: ""  # Specific version or use "" for latest from repo
    values:
      - redis-values.yaml
      - redis-secrets.yaml

  - name: ld-relay
    namespace: default
    chart: launchdarkly-ld-relay/ld-relay
    version: ""  # Specific version or use "" for latest from repo
    values:
      - ld-relay-values.yaml
      - ld-relay-secrets.yaml
    needs:
      - redis