# Kube-Prometheus-Stack Configuration for Minikube
# Monitors LaunchDarkly Relay Proxy and Redis

# Grafana configuration
grafana:
  enabled: true
  persistence:
    enabled: false  # Ephemeral storage for local dev
  adminPassword: admin
  defaultDashboardsEnabled: true
  service:
    type: ClusterIP

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Disable persistent storage (ephemeral for local dev)
    storageSpec: {}
    retention: 2h
    
    # Allow discovery of ServiceMonitors and PrometheusRules across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchLabels: {}
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false
    
    # LD Relay alert rules are PrometheusRule resources (ld-relay-alerts*.yaml), applied by
    # the helmfile postsync hook

    # Additional scrape configs for LD Relay
    additionalScrapeConfigs:
      - job_name: 'ld-relay'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: ld-relay
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # LD Relay v9 metrics, pushed over OTLP to the OpenTelemetry Collector and exposed on :8889.
      # Discovered from the collector's endpoints, so the target only exists when RELAY_VERSION=v9.
      # honor_labels keeps the job/instance labels the collector derives from Relay's
      # service.name/service.instance.id, so Relay series carry job="ld-relay"
      - job_name: 'ld-relay-otel'
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: otel-collector
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: prom-export

# Alertmanager - enabled for alerting
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
    receivers:
      - name: 'default'
        # Add your notification config here (webhook, email, Slack, etc.)
        # webhook_configs:
        #   - url: 'http://your-webhook-url'

# Node Exporter - disabled for local dev (not needed)
nodeExporter:
  enabled: false

# Kube State Metrics - enabled to monitor cluster state
kubeStateMetrics:
  enabled: true

# Prometheus Operator
prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Disable default monitoring for kubelets, API servers, etc. to reduce resource usage
kubeApiServer:
  enabled: false

kubelet:
  enabled: false

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

