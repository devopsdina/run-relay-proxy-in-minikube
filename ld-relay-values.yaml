# LaunchDarkly Relay Proxy - Minikube Configuration
#
# IMPORTANT: DO NOT commit SDK keys to version control!
#
# For local testing:
#   cp values-secrets.yaml.example values-secrets.yaml
#   Add SDK keys to values-secrets.yaml (gitignored)
#   helm install ld-relay launchdarkly-ld-relay/ld-relay -f values.yaml -f values-secrets.yaml
#
# ============================================================================
# Configuration Options
# ============================================================================

replicaCount: 1

image:
  repository: launchdarkly/ld-relay
  pullPolicy: IfNotPresent
  # tag is set per Relay version in ld-relay-values-v8.yaml / ld-relay-values-v9.yaml

service:
  type: ClusterIP
  ports:
    - port: 8030
      targetPort: 8030
      protocol: TCP
      name: api
    # v8 adds the 8031 Prometheus metrics port in ld-relay-values-v8.yaml

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

