initContainers:
  - name: wait-for-redis
    command:
      - 'sh'
      - '-c'
      - |
        echo "Waiting for Redis to be ready..."
        until nc -z redis-master 6379; do
          echo "Redis is unavailable - sleeping"
          sleep 2
        done
        echo "Redis is ready!"

# nameOverride: ""
# fullnameOverride: ""

# terminationGracePeriodSeconds: null

# ============================================================================
# Advanced Relay Configuration
# ============================================================================
# Additional environment variables for the relay container
# See: https://docs.launchdarkly.com/home/relay-proxy/configuration
#
relay:
  environment:
    LOG_LEVEL: "debug"  # debug, info, warn, error

#     # Redis configuration (for persistent storage and offline mode)
#     # See README.md for Redis setup instructions
    USE_REDIS: "true"
    REDIS_HOST: "redis-master"  # Use "redis-master" if using Bitnami Redis chart
    REDIS_PORT: "6379"
#     # REDIS_TLS: "false"
#     # CACHE_TTL: "30"  # Cache time-to-live in seconds
#     
#     # Port configuration
#     PORT: "8030"
#     
#     # Metrics and monitoring
#     PROMETHEUS_PORT: "8031"
#
  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      port: api
      path: /status
  
  readinessProbe:
    httpGet:
      port: api
      path: /status
#
#   # Lifecycle hooks
#   lifecycle: []
#
#   # Offline mode configuration
#   offlineMode:
#     enabled: false
#     # existingConfigMap: ""
#     # mountPath: "/ldr"

