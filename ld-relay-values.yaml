# ============================================================================
# Advanced Relay Configuration
# ============================================================================
# Additional environment variables for the relay container
# See: https://docs.launchdarkly.com/home/relay-proxy/configuration
#
relay:
  environment:
    LOG_LEVEL: "debug"  # debug, info, warn, error

    # Redis configuration (for persistent storage and offline mode)
    # See README.md for Redis setup instructions
    # Note: USE_REDIS is controlled by datastore overlay files (ld-relay-values-redis.yaml, etc.)
    USE_REDIS: "false"
    REDIS_HOST: "redis-master"  # Use "redis-master" if using Bitnami Redis chart
    REDIS_PORT: "6379"
    # REDIS_TLS: "false"
    
    # Cache configuration
    CACHE_TTL: "-1s"  # -1 = infinite cache TTL (never expire cached flags)
    
    # Connection handling
    IGNORE_CONNECTION_ERRORS: "true"  # Continue serving from cache even if LaunchDarkly is unreachable
    INIT_TIMEOUT: "5s"  # Currently using default: 10 seconds (timeout for initial connection)
    
    # Port configuration
    # PORT: "8030"
    
    # Maximum REPORT evaluation request body. v9 defaults to 5MiB and v8 has no limit,
    # so set it explicitly to keep both versions consistent
    MAX_CLIENT_REQUEST_BODY_SIZE: "5MiB"

    # Metrics and monitoring are version-specific: see ld-relay-values-v8.yaml (Prometheus)
    # and ld-relay-values-v9.yaml (OpenTelemetry)

  # Liveness and readiness probes
  # Override default httpGet probes to check connectionStatus JSON field
  livenessProbe:
    httpGet: null  # Explicitly disable httpGet handler
    exec:
      command:
        - sh
        - -c
        - |
          RESPONSE=$(wget -qO- http://localhost:8030/status || exit 1)
          echo "$RESPONSE" | grep -q '"status":"healthy"' || exit 1
          exit 0
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet: null  # Explicitly disable httpGet handler
    exec:
      command:
        - sh
        - -c
        - |
          RESPONSE=$(wget -qO- http://localhost:8030/status || exit 1)
          echo "$RESPONSE" | grep -q '"status":"healthy"' || exit 1
          exit 0
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
